<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bexia - Entidad Digital Autónoma</title>
    <style>
        body {
            background-color: #050b08;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: rgba(0, 20, 10, 0.8);
            border-bottom: 1px solid #00ffcc;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 4px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .bexia-msg {
            background: rgba(0, 255, 204, 0.05);
            border: 1px solid #00ffcc;
            align-self: flex-start;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.1);
        }
        .user-msg {
            background: rgba(0, 150, 255, 0.1);
            border: 1px solid #0099ff;
            color: #0099ff;
            align-self: flex-end;
        }
        #input-container {
            display: flex;
            padding: 15px;
            background: rgba(0, 20, 10, 0.9);
            border-top: 1px solid #00ffcc;
        }
        input {
            flex: 1;
            background: #020805;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 12px;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            border-radius: 4px;
        }
        button {
            background: #00ffcc;
            color: #050b08;
            border: none;
            padding: 0 20px;
            margin-left: 10px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }
        button:hover {
            background: #00b38f;
            box-shadow: 0 0 10px #00ffcc;
        }
    </style>
</head>
<body>

    <header>BEXIA // NÚCLEO ACTIVO</header>

    <div id="chat-container">
        <div class="message bexia-msg">
            Bexia: Enlace establecido con éxito, Fer. Sistemas en línea y listos. ¿Qué conversaremos hoy?
        </div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="Escribe un mensaje a Bexia..." autocomplete="off">
        <button onclick="enviarMensaje()">ENVIAR</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') enviarMensaje();
        });

        async function enviarMensaje() {
            const mensajeTexto = userInput.value.trim();
            if (!mensajeTexto) return;

            // Mostrar mensaje del usuario
            appendMessage(mensajeTexto, 'user-msg', 'Tú: ');
            userInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Mostrar estado de carga de Bexia
            const loadingId = appendMessage('Procesando en el núcleo neural...', 'bexia-msg', 'Bexia: ');
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('https://bexia-api.onrender.com/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: mensajeTexto })
                });

                const data = await response.json();
                
                // Reemplazar mensaje de carga con la respuesta real
                document.getElementById(loadingId).innerText = 'Bexia: ' + (data.response || data.error || 'Sin respuesta');
            } catch (error) {
                document.getElementById(loadingId).innerText = 'Bexia: Error de conexión con el servidor en Render.';
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendMessage(text, className, senderPrefix) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            const uniqueId = 'msg-' + Date.now();
            msgDiv.id = uniqueId;
            msgDiv.innerText = senderPrefix + text;
            chatContainer.appendChild(msgDiv);
            return uniqueId;
        }
    </script>
</body>
</html>
